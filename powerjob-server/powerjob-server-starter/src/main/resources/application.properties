# Http server port
server.port=7700

spring.profiles.active=daily
spring.main.banner-mode=log
spring.jpa.open-in-view=false
spring.data.mongodb.repositories.type=none
logging.level.org.mongodb=warn

# Configuration for uploading files.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.max-file-size=209715200
spring.servlet.multipart.max-request-size=209715200

###### PowerJob transporter configuration  ######
oms.transporter.active.protocols=AKKA,HTTP,MU
oms.transporter.main.protocol=HTTP
oms.akka.port=10086
oms.http.port=10010
oms.mu.port=10077
# Prefix for all tables. Default empty string. Config if you have needs, i.e. pj_
oms.table-prefix=

###### PowerJob instance liveness check configuration (normal tasks only) ######
# Report-stall threshold for RUNNING instances (ms). Default 60000, same as the legacy behavior.
oms.instance.check.report-timeout-ms=60000
# Worker heartbeat timeout threshold (ms). Default 60000, same as the legacy WorkerInfo judgment.
oms.instance.check.heartbeat-timeout-ms=60000
# Timeout (ms) of a single probe (ServerQueryInstanceStatusReq) when the worker heartbeat is
# alive but its instance report stalls. Default 3000, the exact value is still to be confirmed.
oms.instance.check.probe-timeout-ms=3000
# Max concurrency of the probe executor. Default 16, the exact value is still to be confirmed.
oms.instance.check.probe-concurrency=16

###### PowerJob User and Permission Configuration Configuration  ######
oms.auth.initiliaze.admin.password=powerjob_admin
oms.auth.openapi.enable=false
# Recommended for public deployments: configure the same independently generated
# secret (at least 32 characters) on every Server. Changing it invalidates existing JWTs.
# oms.auth.security.jwt.secret=<RANDOM_SECRET>
